:root{
  --ink:#2a1d14; --ink-2:#4a382a; --muted:#6b5646; --line:#e8ded1; --line-2:#f0e8dd;

}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brown)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.logo{width:38px;height:38px;flex:none}

.tt b{display:block;font:400 18px/1 var(--brand);text-transform:uppercase;letter-spacing:.01em}
.tt b em{font-style:normal;color:var(--coral)}
.tt small{display:block;font-size:12px;color:var(--cuero-suave);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);flex:none}
.topbtn:hover{background:rgba(255,255,255,.16)}
.prog{display:flex;align-items:center;gap:10px;padding-block:0 10px;font-size:12px;color:#eee4d7}
.prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,248,239,.15);overflow:hidden}
.prog u{display:block;height:100%;background:var(--coral);border-radius:4px;transition:width .4s}
.prog b{color:#fff;font-weight:800}

main{display:flex;flex-direction:column;gap:16px;padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px);max-width:760px;margin:0 auto;box-sizing:border-box}
.view{display:flex;flex-direction:column;gap:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.4}
.banner b{color:var(--ink)}
.banner .i{margin-top:1px}

/* cifras */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font:400 21px/1.15 var(--brand);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b span{font:700 12px var(--font);color:var(--muted);margin-left:2px}

.seg{display:flex;gap:6px;padding:4px;background:var(--line-2);border-radius:13px}
.seg button{flex:1;height:40px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(54,35,22,.16)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:800;font-size:14px;margin:4px 0 -6px}
.sect small{font-weight:600;font-size:12px;color:var(--muted)}

/* hoja de carga */
.sheet{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line-2);width:100%;text-align:left;box-sizing:border-box}
.prow:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:transparent;background:var(--field)}
.prow.on .chk{background:var(--ok);box-shadow:none;color:var(--card)}
.prow.on .pn{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.pn{font-weight:700;font-size:15px;line-height:1.25}
.pd{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pd span{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:6px;background:var(--kraft-bg);color:var(--kraft);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.qty{font:400 24px/1 var(--brand);font-variant-numeric:tabular-nums;text-align:right}
.qty small{display:block;font:700 10px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-top:1px solid var(--line-2)}
.lrow:first-child{border-top:0}
.lrow .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brown);color:#fff;font:400 13px var(--brand)}
.lrow b{display:block;font-weight:800;font-size:14px}
.lrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lrow ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2)}
.lrow ul b{display:inline;font-size:13px}
.lrow .pos{font-size:11px;font-weight:800;color:var(--kraft);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;text-align:right}
.tip{font-size:12.5px;color:var(--muted);line-height:1.45;padding:0 2px}

/* pedidos por cliente */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.card.done{opacity:.7}
.ch{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:start}
.badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--on-red);font:400 15px var(--brand);box-shadow:0 3px 8px rgba(195,10,19,.3)}
.card.done .badge{background:var(--ok);box-shadow:none}
.ch b{display:block;font-weight:800;font-size:16px;line-height:1.25}
.ch small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.eta{text-align:right;white-space:nowrap}
.eta b{font:400 16px var(--brand);font-variant-numeric:tabular-nums}
.eta small{font-size:11px}
.lines{list-style:none;margin:0;padding:0;border-radius:12px;background:var(--field)}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid var(--line-2);font-size:14px}
.lines li:first-child{border-top:0}
.lines li b{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.money{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:13px;color:var(--ink-2)}
.money b{font:400 17px var(--brand);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13px;color:var(--ink-2);background:var(--kraft-bg);border-radius:10px;padding:8px 10px;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;background:var(--field);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;flex:1 1 auto}
.btn.pri{background:var(--red);color:var(--on-red);box-shadow:none}.btn.pri:hover{background:var(--red-2)}
.btn.ok{background:var(--ok);color:var(--card);box-shadow:none}
.btn.sm{min-height:36px;font-size:13px;padding:0 10px;flex:0 1 auto}
.pay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pay button{min-height:42px;border-radius:10px;font-weight:800;font-size:13px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line)}
.pay button:hover{box-shadow:inset 0 0 0 2px var(--red-2)}
.pay button.on{background:var(--red);color:var(--on-red);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}\n.imp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink-2);margin:4px 0 8px}.imp input{flex:1;min-width:0;max-width:140px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:800 16px var(--font);padding:0 10px;text-align:right}\n.note.ofr{display:flex;gap:8px;align-items:flex-start;background:var(--ok-bg);color:var(--ink)}.note.ofr .i{flex:none;margin-top:1px;color:var(--ok)}.note.ofr b{color:var(--ok)}
.incn{width:100%;min-height:64px;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:14px var(--font);padding:10px;margin-top:8px}
.cierre{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cierre div{background:var(--field);border-radius:12px;padding:10px 12px}.cierre small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.cierre b{font:400 20px var(--brand)}
.clist{list-style:none;margin:0;padding:0;font-size:13px}.clist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.clist li:first-child{border-top:0}
.tel{font-size:13px;color:var(--muted)}
.tel b{color:var(--ink);user-select:all;font-variant-numeric:tabular-nums}

/* ruta */
.next{background:linear-gradient(135deg,var(--brown),var(--brown-2));color:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px rgba(40,26,16,.3)}
.next small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.next b{font:400 19px/1.2 var(--brand)}
.next p{margin:0;font-size:13px;color:#e9d5be;line-height:1.4}
.next .btn{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.next .btn.pri{background:var(--red);color:var(--on-red);box-shadow:var(--shadow-btn)}
#map{height:min(52vh,420px);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;background:var(--map-bg);position:relative;z-index:1}
.leaflet-container{background:var(--map-bg);font-family:var(--font)}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--on-red);font:400 13px/1 var(--brand);box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.35)}
.mk.done{background:var(--ok)}
.mk.nave{background:var(--brown);border-radius:9px;width:34px;height:34px}
.mk.me{background:#1f6feb;width:18px;height:18px}
.mapnote{font-size:12px;color:var(--muted);line-height:1.4;padding:0 2px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700}
.tog i{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on i{background:var(--ok)}
.tog.on i::after{transform:translateX(14px)}
.tog input{width:88px;border:0;background:var(--field);border-radius:7px;font:inherit;font-weight:800;color:var(--ink);padding:4px 6px}
.stops{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.st{display:grid;grid-template-columns:52px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2)}
.st:first-child{border-top:0}
.st .h{font:400 14px var(--brand);font-variant-numeric:tabular-nums}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:var(--on-red);font:400 12px var(--brand)}
.st.nave .n{background:var(--brown);border-radius:8px}
.st.done .n{background:var(--ok)}
.st.done .t b{text-decoration:line-through;text-decoration-color:var(--muted)}
.st .t{min-width:0}
.st .t b{display:block;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .km{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.method{font-size:12px;color:var(--muted);line-height:1.45;padding:0 2px}
.method b{color:var(--ink-2)}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(54,35,22,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto;height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
.tabs button .i{width:22px;height:22px}
.tabs button.on{color:var(--red)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tabs button em{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:var(--on-red);font:800 10px/18px var(--font);font-style:normal;padding:0 4px;box-sizing:border-box}

/* panel importar */
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(20,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;box-sizing:border-box}
.panel h2{margin:0;font:400 18px var(--brand)}
.panel p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.panel textarea{width:100%;min-height:120px;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:12px ui-monospace,Menlo,monospace;padding:10px}
.panel .err{color:var(--bad);font-size:13px;font-weight:700}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:90;background:var(--brown);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 22px rgba(40,26,16,.35);max-width:calc(100% - 32px);box-sizing:border-box}
.empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
@media (max-width:380px){.kpi b{font-size:18px}.pay{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* entrada segura */
.gate{position:fixed;inset:0;z-index:95;background:linear-gradient(160deg,var(--brown),var(--brown-2));color:#fff8ef;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;box-sizing:border-box}
.gate[hidden]{display:none}
.gate .gc{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.gate svg.logo{width:64px;height:64px}
.gate h1{margin:0;font:400 24px/1.1 var(--brand);text-transform:uppercase}
.gate h1 em{font-style:normal;color:#ff5f57}
.gate p{margin:0;font-size:14px;line-height:1.5;color:rgba(255,248,239,.82)}
.gate p b{color:#fff}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--oro)}
.gate input{min-height:50px;border-radius:12px;border:1px solid rgba(255,248,239,.25);background:rgba(255,248,239,.08);color:#fff;font:700 17px var(--font);padding:0 14px;box-sizing:border-box;width:100%}
.gate input.code{font:800 24px ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center}
.gate input.key{font:800 16px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.gate input:focus{outline:2px solid var(--oro);outline-offset:1px}
.gate .btn.pri{min-height:50px;font-size:15px;box-shadow:var(--shadow-btn)}
.gate .lk{background:none;border:0;color:#ffd38a;font-weight:800;font-size:13px;padding:6px 0;text-decoration:underline;align-self:flex-start;cursor:pointer}
.gate .err{background:rgba(255,95,87,.16);color:#ffb4ae;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}
.gate .lock{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:rgba(255,248,239,.6);line-height:1.45}
.gate .lock .i{width:16px;height:16px;flex:none;margin-top:1px}
.mrow{display:flex;flex-wrap:wrap;gap:8px}
.mrow .btn.on{background:var(--red);color:var(--on-red)}
.priv{position:fixed;inset:0;z-index:99;background:#2a1d14;display:grid;place-items:center}.priv[hidden]{display:none}.priv .logo{width:72px;height:72px}
</style>

<script>
"use strict";

/* ============ ruta óptima ============ */
const rad=x=>x*Math.PI/180;
function hav(a,b){const R=6371,dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon),s=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
// matriz estimada sin conexión: km por carretera ≈ recta × factor; minutos a velocidad media
function matrizLocal(pts){const n=pts.length,D=[],T=[];for(let i=0;i<n;i++){D[i]=[];T[i]=[];for(let j=0;j<n;j++){const km=i===j?0:hav(pts[i],pts[j])*FACTOR_VIA;D[i][j]=km;T[i][j]=km/VEL_KMH*60;}}return {D,T,fuente:'estimada'};}
// con conexión (app instalada): tiempos reales por carretera de OSRM (OpenStreetMap)
async function matrizOSRM(pts){
  const c=pts.map(p=>p.lon.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),5000);
  try{const r=await fetch('https://router.project-osrm.org/table/v1/driving/'+c+'?annotations=duration,distance',{signal:ctl.signal});
    const j=await r.json();if(j.code!=='Ok')throw 0;
    return {D:j.distances.map(r=>r.map(x=>x/1000)),T:j.durations.map(r=>r.map(x=>x/60)),fuente:'carretera'};}
  finally{clearTimeout(to);}
}
// Held-Karp: orden exacto que minimiza el tiempo total (hasta 13 paradas). Con más, vecino más cercano + 2-opt.
function optimiza(T,vuelta){
  const n=T.length-1;if(n<=0)return [];
  if(n<=13){
    const N=1<<n,INF=1e15,dp=new Float64Array(N*n).fill(INF),par=new Int8Array(N*n).fill(-1);
    for(let j=0;j<n;j++)dp[(1<<j)*n+j]=T[0][j+1];
    for(let m=1;m<N;m++)for(let j=0;j<n;j++){const v=dp[m*n+j];if(v>=INF||!(m>>j&1))continue;
      for(let k=0;k<n;k++){if(m>>k&1)continue;const m2=m|1<<k,w=v+T[j+1][k+1];if(w<dp[m2*n+k]){dp[m2*n+k]=w;par[m2*n+k]=j;}}}
    let best=INF,last=0,full=N-1;
    for(let j=0;j<n;j++){const w=dp[full*n+j]+(vuelta?T[j+1][0]:0);if(w<best){best=w;last=j;}}
    const ord=[];let m=full,j=last;while(j>=0){ord.push(j+1);const pj=par[m*n+j];m&=~(1<<j);j=pj;}
    return ord.reverse();
  }
  const left=new Set([...Array(n)].map((_,i)=>i+1)),ord=[];let cur=0;
  while(left.size){let b=null,bv=1e15;for(const k of left)if(T[cur][k]<bv){bv=T[cur][k];b=k;}ord.push(b);left.delete(b);cur=b;}
  const cost=o=>{let s=T[0][o[0]];for(let i=1;i<o.length;i++)s+=T[o[i-1]][o[i]];return s+(vuelta?T[o[o.length-1]][0]:0);};
  let mejora=true,c0=cost(ord);
  while(mejora){mejora=false;for(let i=0;i<ord.length-1;i++)for(let k=i+1;k<ord.length;k++){const o2=ord.slice(0,i).concat(ord.slice(i,k+1).reverse(),ord.slice(k+1));const c2=cost(o2);if(c2<c0-1e-9){ord.splice(0,ord.length,...o2);c0=c2;mejora=true;}}}
  return ord;
}
let calcN=0;
async function calcula(){
  const r=S.ruta;if(!r)return;const id=++calcN;
  const pend=r.paradas.filter(p=>!S.hecho[p.id]&&p.lat!=null&&p.lon!=null);
  const ini=S.desde||r.nave,pts=[ini,...pend];
  if(S.vuelta&&S.desde)pts.push(r.nave);   // saliendo desde donde estoy: la vuelta es a la nave, no al punto de partida
  let M=matrizLocal(pts);
  render();
  if(S.osrm&&navigator.onLine!==false&&pts.length>2){try{const m2=await matrizOSRM(pts);if(id!==calcN)return;M=m2;}catch(e){}}
  if(id!==calcN)return;
  // saliendo desde la posición actual con vuelta: la nave es el último punto; la columna 0 («volver al inicio») pasa a ser «volver a la nave»
  let T=M.T;
  if(S.desde&&S.vuelta){const k=pts.length-1;T=M.T.slice(0,k).map((row,i)=>{const r2=row.slice(0,k);if(i>0)r2[0]=M.T[i][k];return r2;});}
  const ord=optimiza(T,S.vuelta);
  // tramos con hora estimada de llegada
  const legs=[];let t=hm2min(S.salida),prev=0;
  if(S.desde){const now=new Date();t=now.getHours()*60+now.getMinutes();}
  for(const k of ord){const km=M.D[prev][k],min=M.T[prev][k];t+=min;legs.push({p:pts[k],km,min,llega:t});t+=PARADA_MIN;prev=k;}
  let vueltaLeg=null;
  if(S.vuelta&&ord.length){const back=S.desde?pts.length-1:0,km=M.D[prev][back],min=M.T[prev][back];t+=min;vueltaLeg={km,min,llega:t};}
  S.orden=legs;S.vueltaLeg=vueltaLeg;S.fuente=M.fuente;
  // número de parada fijo para hoy: el del orden óptimo calculado desde la nave
  // se fija la primera vez que se calcula la ruta del día (con nada entregado) y ya no cambia: es el número que lleva el bulto
  if(!S.desde&&!S.num&&!Object.keys(S.hecho).length){const num={};let i=1;for(const l of legs)num[l.p.id]=i++;
    for(const p of r.paradas)if(!(p.id in num))num[p.id]=i++;S.num=num;LS.set('num_'+rkey(),S.num);}
  else if(S.num){let i=Math.max(0,...Object.values(S.num).map(Number))+1,cambia=false;for(const l of legs)if(!(l.p.id in S.num)){S.num[l.p.id]=i++;cambia=true;}
    for(const p of r.paradas)if(!(p.id in S.num)){S.num[p.id]=i++;cambia=true;}if(cambia)LS.set('num_'+rkey(),S.num);}
  render();
}
const hm2min=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?+m[1]*60+ +m[2]:420;};
const min2hm=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const durTxt=m=>{m=Math.round(m);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');};

function render(){
  const r=S.ruta,m=document.getElementById('main');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(!r){m.innerHTML=`<div class="empty">${esc(SEC.vacio||'Conectando…')}${SEC.vacio?'<div class="acts" style="justify-content:center;margin-top:12px"><button class="btn" data-m="act">Actualizar</button><button class="btn" data-m="demo">Ver un ejemplo</button></div>':''}</div>`;document.getElementById('hdrSub').textContent=SEC.email||'';['pgDone','pgTot'].forEach(i=>document.getElementById(i).textContent='0');return;}
  const tot=r.paradas.length,hechos=r.paradas.filter(p=>S.hecho[p.id]).length;
  document.getElementById('pgDone').textContent=hechos;document.getElementById('pgTot').textContent=tot;
  document.getElementById('pgBar').style.width=(tot?hechos/tot*100:0)+'%';
  const tp=document.getElementById('tabPend');tp.hidden=tot-hechos===0;tp.textContent=tot-hechos;
  const f=r.fecha?new Date(r.fecha+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'';
  document.getElementById('hdrSub').textContent=[f,r.vehiculo].filter(Boolean).join(' · ')||r.nombre;
  let h=r.ejemplo?`<div class="banner">${ICON.info}<span><b>Ruta de ejemplo.</b> Clientes y pedidos inventados para que veas cómo funciona. Tu ruta real aparece aquí cuando la nave te la envíe.</span></div>`:'';
  if(SEC.offline&&!r.ejemplo)h+=`<div class="banner">${ICON.info}<span><b>Sin conexión.</b> Ves la última copia guardada (cifrada) en este móvil. Las entregas se envían al volver la cobertura.</span></div>`;
  if(S.tab==='carga')h+=vCarga(r);else if(S.tab==='pedidos')h+=vPedidos(r);else h+=vRuta(r);
  const keepMap=S.tab==='ruta'&&S.map&&document.getElementById('map');
  if(keepMap){const mapEl=document.getElementById('map');mapEl.remove();m.innerHTML=h;const slot=document.getElementById('map');slot.replaceWith(mapEl);}
  else{if(S.map){S.map.remove();S.map=null;}m.innerHTML=h;}

}

function vCarga(r){
  const P=r.paradas,prods={};let bultos=0;
  for(const p of P)for(const [n,q] of p.lin){const k=n.trim();(prods[k]=prods[k]||{n:k,q:0,por:[]});prods[k].q+=q;prods[k].por.push([numDe(p),q]);bultos+=q;}
  const L=Object.values(prods).sort((a,b)=>b.q-a.q||a.n.localeCompare(b.n,'es'));
  const cobrar=P.reduce((s,p)=>s+p.importe,0),cargados=L.filter(x=>S.cargado[x.n]).length;
  let h=`<div class="kpis"><div class="kpi"><small>Bultos</small><b class="num">${bultos}</b></div><div class="kpi"><small>Productos</small><b class="num">${cargados}<span>/ ${L.length}</span></b></div><div class="kpi"><small>Pedidos</small><b class="num">${eur(cobrar).replace(' €','')}<span>€</span></b></div></div>
  <div class="seg" role="tablist"><button data-cm="prod" class="${S.cargaModo==='prod'?'on':''}">Por producto</button><button data-cm="orden" class="${S.cargaModo==='orden'?'on':''}">Orden de carga</button></div>`;
  if(S.cargaModo==='prod'){
    h+=`<div class="sect">Hoja de carga <small>toca cada producto al subirlo</small></div><div class="sheet">`+L.map(x=>{
      const on=!!S.cargado[x.n];x.por.sort((a,b)=>(+a[0]||99)-(+b[0]||99));
      return `<button class="prow${on?' on':''}" data-load="${esc(x.n)}" aria-pressed="${on}"><span class="chk">${ICON.check}</span><span style="min-width:0"><span class="pn">${esc(x.n)}</span><span class="pd">${x.por.map(([n,q])=>`<span>#${n} ×${q}</span>`).join('')}</span></span><span class="qty">${x.q}<small>uds</small></span></button>`;}).join('')+`</div>`;
    h+=`<p class="tip">«#3 ×4» es la parada 3 de la ruta, 4 unidades. Al terminar la carga, pasa a <b>Orden de carga</b> para colocarla en la furgoneta.</p>`;
  }else{
    const O=[...P].sort(porNum).reverse();
    h+=`<div class="sect">Orden de carga <small>lo primero que cargas va al fondo</small></div><div class="sheet">`+O.map((p,i)=>`<div class="lrow"><span class="n">${numDe(p)}</span><div style="min-width:0"><b>${esc(p.cli)}</b><small>${esc(p.zona||p.dir)}</small><ul>${p.lin.map(l=>`<li><b>${l[1]}</b> × ${esc(l[0])}</li>`).join('')}</ul></div><span class="pos">${i===0?'Al fondo':i===O.length-1?'En la puerta':''}</span></div>`).join('')+`</div>`;
    h+=`<p class="tip">Va al revés que la ruta: el último cliente se carga primero y el primero queda junto a la puerta, así no hay que mover bultos en cada parada.</p>`;
  }
  return h;
}

function vPedidos(r){
  const q=S.q.trim().toLowerCase();
  let P=[...r.paradas].sort(porNum);
  const pend=P.filter(p=>!S.hecho[p.id]),hech=P.filter(p=>S.hecho[p.id]);
  const efectivo=hech.reduce((s,p)=>s+(S.hecho[p.id].pago==='Efectivo'?S.hecho[p.id].total:0),0);
  const otros=hech.reduce((s,p)=>s+(['Bizum','Tarjeta'].includes(S.hecho[p.id].pago)?S.hecho[p.id].total:0),0);
  let h=`<div class="kpis"><div class="kpi"><small>Quedan</small><b class="num">${pend.length}<span>/ ${P.length}</span></b></div><div class="kpi"><small>Efectivo</small><b class="num">${eur(efectivo).replace(' €','')}<span>€</span></b></div><div class="kpi"><small>Bizum·tarjeta</small><b class="num">${eur(otros).replace(' €','')}<span>€</span></b></div></div>
  <div class="acts" style="margin:0"><button class="btn sm" data-cierre>${ICON.check}Cierre del día</button></div>
  <div class="seg"><button data-pf="pend" class="${S.pedFlt==='pend'?'on':''}">Pendientes · ${pend.length}</button><button data-pf="hech" class="${S.pedFlt==='hech'?'on':''}">Entregados · ${hech.length}</button><button data-pf="todos" class="${S.pedFlt==='todos'?'on':''}">Todos</button></div>
  <label class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar cliente o calle" value="${esc(S.q)}" autocomplete="off"></label>`;
  P=S.pedFlt==='pend'?pend:S.pedFlt==='hech'?hech:P;
  if(q)P=P.filter(p=>(p.cli+' '+p.dir+' '+p.zona).toLowerCase().includes(q));
  if(!P.length)return h+`<div class="empty">${S.pedFlt==='pend'&&!q?'Todo entregado. Entrega el efectivo al volver a la nave.':'Ningún pedido coincide.'}</div>`;

// plano sin conexión (si no carga la librería del mapa): paradas y ruta a escala, sin calles
function mapaSVG(el,r){
  const start=S.desde||r.nave,seq=[start,...(S.orden||[]).map(l=>l.p)];if(S.vuelta&&seq.length>1)seq.push(r.nave);
  const all=[r.nave,...r.paradas.filter(p=>p.lat!=null)];if(S.desde)all.push(S.desde);
  const W=400,H=300,pad=30,kx=Math.cos(rad(40.3));
  const xs=all.map(p=>p.lon*kx),ys=all.map(p=>p.lat),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=Math.min((W-2*pad)/((x1-x0)||1e-3),(H-2*pad)/((y1-y0)||1e-3)),ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;
  const X=p=>(ox+(p.lon*kx-x0)*s).toFixed(1),Y=p=>(H-oy-(p.lat-y0)*s).toFixed(1);
  const km5=5/111*s;  // 5 km en píxeles (en latitud)
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block">`;
  if(seq.length>1)g+=`<polyline points="${seq.map(p=>X(p)+','+Y(p)).join(' ')}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round"/>`;
  for(const p of r.paradas)if(p.lat!=null){const d=S.hecho[p.id];g+=`<circle cx="${X(p)}" cy="${Y(p)}" r="11" fill="${d?'var(--ok)':'var(--red)'}" stroke="var(--card)" stroke-width="2.5"/><text x="${X(p)}" y="${(+Y(p)+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff" font-family="var(--font)">${d?'✓':numDe(p)}</text>`;}
  g+=`<rect x="${X(r.nave)-12}" y="${Y(r.nave)-12}" width="24" height="24" rx="7" fill="var(--brown)" stroke="var(--card)" stroke-width="2.5"/><text x="${X(r.nave)}" y="${(+Y(r.nave)+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="var(--font)">N</text>`;
  if(S.desde)g+=`<circle cx="${X(S.desde)}" cy="${Y(S.desde)}" r="8" fill="#1f6feb" stroke="var(--card)" stroke-width="3"/>`;
  g+=`<g transform="translate(14 ${H-16})"><line x1="0" y1="0" x2="${km5.toFixed(1)}" y2="0" stroke="var(--muted)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="var(--muted)" stroke-width="2"/><line x1="${km5.toFixed(1)}" y1="-4" x2="${km5.toFixed(1)}" y2="4" stroke="var(--muted)" stroke-width="2"/><text x="${(km5/2).toFixed(1)}" y="-7" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)" font-family="var(--font)">5 km</text></g>`;
  el.innerHTML=g+'</svg>';el.style.height='auto';el.style.aspectRatio='4/3';
  if(!document.getElementById('mapNote')){const n=document.createElement('p');n.id='mapNote';n.className='mapnote';n.textContent='Plano sin calles (sin conexión). «Navegar» abre Google Maps con la dirección.';el.after(n);}
}

  const at=await token();if(!at)throw new Error('sesion');
  const w=conTiempo(15000);let r;try{r=await fetch(SB.url+'/rest/v1/'+path,Object.assign({},opt,{signal:w.signal,headers:Object.assign({apikey:SB.key,Authorization:'Bearer '+at,'Content-Type':'application/json'},opt&&opt.headers)}));}catch(e){throw new Error('offline');}finally{w.fin();}
  if(r.status===401){SES.clear();throw new Error('sesion');}
  if(!r.ok)throw new Error('Error '+r.status);const t=await r.text();return t?JSON.parse(t):null;}

/* clave de reparto: PBKDF2-SHA256 (210.000 vueltas) → AES-256-GCM, guardada no exportable */
const IDB={db:null,
  async open(){if(this.db)return this.db;this.db=await new Promise((ok,ko)=>{const r=indexedDB.open('gato-reparto',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});return this.db;},
  async op(mode,fn){const db=await this.open();return new Promise((ok,ko)=>{const tx=db.transaction('k',mode),rq=fn(tx.objectStore('k'));tx.oncomplete=()=>ok(rq.result);tx.onerror=()=>ko(tx.error);});},
  get(k){return this.op('readonly',s=>s.get(k));},set(k,v){return this.op('readwrite',s=>s.put(v,k));},clear(){return this.op('readwrite',s=>s.clear());}};
async function deriva(clave,email){
  const base=await crypto.subtle.importKey('raw',TE.encode(normClave(clave)),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:TE.encode('gato-reparto|'+email.toLowerCase()),iterations:210000},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
// cobro o incidencia de una parada: cifrado con la misma clave; solo Gato Control lo puede leer
async function cifraDato(obj,pid){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(SEC.dia+'|'+SEC.email+'|'+pid)},SEC.key,TE.encode(JSON.stringify(obj))));
  return {v:1,alg:'AES-256-GCM',iv:b64e(iv),ct:b64e(ct)};}
async function descifraDato(d,pid){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(d.iv),additionalData:TE.encode(SEC.dia+'|'+SEC.email+'|'+pid)},SEC.key,b64d(d.ct));return JSON.parse(TD.decode(pt));}
// estado local del día (cobros, notas, productos cargados): cifrado con la clave; sin ella no se lee nada de este móvil
let guardaT=null;
async function guardaE(k,obj){if(!SEC.key)return;const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode('local|'+SEC.email+'|'+k)},SEC.key,TE.encode(JSON.stringify(obj))));
  LS.set('e_'+k,{iv:b64e(iv),ct:b64e(ct)});}
async function leeE(k){const d=LS.get('e_'+k,null);if(!d||!SEC.key)return null;
  try{return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(d.iv),additionalData:TE.encode('local|'+SEC.email+'|'+k)},SEC.key,b64d(d.ct))));}catch(e){return null;}}
function guardaLocal(){clearTimeout(guardaT);guardaT=setTimeout(()=>{guardaE('hecho_'+rkey(),S.hecho);guardaE('cargado_'+rkey(),S.cargado);},150);}
// limpieza: versiones anteriores guardaban esto en claro
try{for(const k of Object.keys(localStorage))if(/^gr_(hecho|cargado|ruta)/.test(k))localStorage.removeItem(k);}catch(e){}
async function descifra(key,payload,fecha,email){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(payload.iv),additionalData:TE.encode(fecha+'|'+email.toLowerCase())},key,b64d(payload.ct));
  return JSON.parse(TD.decode(pt));}

/* pantallas de entrada */
const LOGO=document.querySelector('header svg.logo').outerHTML;
const CANDADO='<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function gate(html){const g=document.getElementById('gate');g.hidden=false;g.innerHTML=`<div class="gc">${LOGO}${html}</div>`;const i=g.querySelector('input');if(i)setTimeout(()=>i.focus(),50);}
function sinGate(){const g=document.getElementById('gate');g.hidden=true;g.innerHTML='';}
// la contraseña de entrada se saca de la clave con otra sal: el servidor la comprueba pero no puede sacar de ella la llave de cifrado
async function acceso(clave,email){
  const base=await crypto.subtle.importKey('raw',TE.encode(normClave(clave)),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:TE.encode('gato-reparto-login|'+email.toLowerCase()),iterations:210000},base,256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function pantallaLogin(err,email){
  gate(`<h1>Gato <em>Reparto</em></h1><p>Entra con tu email y la <b>clave de reparto</b> que te han dado en la nave. Solo se pide una vez en este móvil.</p>
    <label>Tu email<input id="gMail" type="email" inputmode="email" autocomplete="username" value="${esc(email||'')}" placeholder="nombre@gmail.com"></label>
    <label>Clave de reparto<input id="gKey" class="key" type="password" autocomplete="current-password" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"></label>
    ${err?`<div class="err">${esc(err)}</div>`:''}<button class="btn pri" id="gOk">Entrar</button>
    <div class="lock">${CANDADO}<span>Las rutas viajan cifradas de extremo a extremo (AES-256): ni el servidor puede leer los datos de los clientes. La clave se guarda en este móvil sin que se pueda volver a leer.</span></div>`);
  const go=async()=>{const e=document.getElementById('gMail').value.trim().toLowerCase(),v=normClave(document.getElementById('gKey').value);
    if(!okEmail(e))return pantallaLogin('Escribe un email válido.',e);
    if(v.length!==20)return pantallaLogin('La clave tiene 20 letras y números (puedes escribirla con o sin guiones).',e);
    const btn=document.getElementById('gOk');btn.disabled=true;btn.textContent='Comprobando…';
    try{const j=await sbAuth('token?grant_type=password',{email:e,password:await acceso(v,e)});SEC.email=e;guardaSes(j);LS.set('desde',Date.now());
      const k=await deriva(v,e);await IDB.set('k:'+e,k);SEC.key=k;arranca();}
    catch(x){pantallaLogin(x instanceof TypeError?'Sin conexión. Inténtalo con cobertura.':x.message,e);}};
  document.getElementById('gOk').onclick=go;
  for(const id of ['gMail','gKey'])document.getElementById(id).onkeydown=ev=>{if(ev.key==='Enter')go();};
}
const pantallaClave=err=>{SES.clear();pantallaLogin(err||'',SEC.email);};
async function salir(){
  try{const at=SES.get();if(at&&navigator.onLine!==false)await fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+at.at}});}catch(e){}
  try{Object.keys(localStorage).filter(k=>k.startsWith('gr_')).forEach(k=>localStorage.removeItem(k));}catch(e){}
  try{await IDB.clear();}catch(e){}
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
  SEC.email='';SEC.key=null;SEC.rutas=[];SEC.rutaId=null;S.ruta=null;cierraImport();pantallaLogin('');
}

/* rutas del repartidor */
async function arranca(){
  const s=SES.get();if(!s)return pantallaLogin('');
  // cada 30 días hay que volver a entrar con la clave: un móvil olvidado no conserva el acceso indefinidamente
  if(Date.now()-(+LS.get('desde',0)||0)>30*864e5){await salir();return pantallaLogin('Han pasado 30 días: vuelve a entrar con tu email y tu clave.',s.email);}
  SEC.email=s.email;try{SEC.key=await IDB.get('k:'+s.email);}catch(e){SEC.key=null;}
  if(!SEC.key)return pantallaClave('');
  if(!(SEC.key.usages||[]).includes('encrypt'))return pantallaClave('Vuelve a entrar una vez con tu clave para activar el envío cifrado de cobros e incidencias.');
  sinGate();await cargaRutas();
}
async function cargaRutas(){
  try{SEC.rutas=await sbRest('rep_rutas?select=id,fecha,payload,n_paradas,creado&order=fecha.asc')||[];SEC.offline=false;LS.set('cache',SEC.rutas);}
  catch(e){if(e.message==='sesion')return pantallaLogin('Tu sesión ha caducado o te han cambiado la clave. Vuelve a entrar.',SEC.email);SEC.rutas=LS.get('cache',[]);SEC.offline=true;}
  const hoy=hoyISO(),R=SEC.rutas;
  const r=R.find(x=>x.fecha===SEC.dia)||R.find(x=>x.fecha===hoy)||R.find(x=>x.fecha>hoy)||R[R.length-1];
  if(!r){if(!S.ruta||!S.ruta.ejemplo){S.ruta=null;SEC.rutaId=null;SEC.vacio='Todavía no tienes ninguna ruta. Aparecerá aquí sola cuando la nave te la envíe.';render();}return;}
  if(SEC.rutaId===r.id&&SEC.creado===r.creado&&S.ruta&&!S.ruta.ejemplo){await sincroniza();return;}
  await abre(r);
}
async function abre(rr){
  let r;try{r=await descifra(SEC.key,rr.payload,rr.fecha,SEC.email);}
  catch(e){try{await IDB.clear();}catch(x){}SEC.key=null;return pantallaClave('La clave guardada no abre la ruta del '+rr.fecha+'. Puede que en la nave te la hayan cambiado: entra con la nueva.');}
  r.fecha=rr.fecha;r.ejemplo=false;let ruta;try{ruta=sanea(r);}catch(e){SEC.vacio='La ruta del '+rr.fecha+' no tiene paradas.';S.ruta=null;render();return;}
  SEC.rutaId=rr.id;SEC.dia=rr.fecha;SEC.creado=rr.creado;await ponRuta(ruta);await sincroniza();
}
// entregas: solo un identificador opaco de la parada viaja al servidor (sin datos del cliente)
async function subeEntrega(p,on){
  if(!SEC.rutaId||!S.ruta||S.ruta.ejemplo||!/^[0-9a-f]{16}$/.test(p.pid||''))return;const k='pdel_'+SEC.rutaId,del=new Set(LS.get(k,[]));
  try{
    if(on){const h=S.hecho[p.id]||{},dato=await cifraDato({pago:h.pago||'',total:+h.total||0,inc:h.inc||'',nota:h.nota||'',t:h.t||''},p.pid);
      await sbRest('rep_entregas?on_conflict=ruta_id,pid',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({ruta_id:SEC.rutaId,pid:p.pid,estado:h.inc?'incidencia':'entregado',dato,at:new Date().toISOString()})});
      del.delete(p.pid);if(S.hecho[p.id])S.hecho[p.id].sync=true;}
    else{await sbRest('rep_entregas?ruta_id=eq.'+SEC.rutaId+'&pid=eq.'+p.pid,{method:'DELETE'});del.delete(p.pid);}
  }catch(e){if(!on)del.add(p.pid);}
  LS.set(k,[...del]);guarda();
}
async function sincroniza(){
  if(!SEC.rutaId||!S.ruta||S.ruta.ejemplo||navigator.onLine===false)return;
  for(const pid of LS.get('pdel_'+SEC.rutaId,[])){const p=S.ruta.paradas.find(x=>x.pid===pid);if(p&&!S.hecho[p.id])await subeEntrega(p,false);}
  for(const p of S.ruta.paradas){const h=S.hecho[p.id];if(h&&!h.sync&&!h.remoto)await subeEntrega(p,true);}
  try{const E=await sbRest('rep_entregas?select=pid,at,estado,dato&ruta_id=eq.'+SEC.rutaId)||[],on=new Set(E.map(e=>e.pid));let cambia=false;
    for(const e of E){const p=S.ruta.paradas.find(x=>x.pid===e.pid);if(p&&!S.hecho[p.id]){const d=new Date(e.at);let x={};try{if(e.dato)x=await descifraDato(e.dato,p.pid);}catch(er){}
      S.hecho[p.id]={pago:x.pago||'—',total:+x.total||0,inc:x.inc||(e.estado==='incidencia'?'Incidencia':''),nota:x.nota||'',t:x.t||min2hm(d.getHours()*60+d.getMinutes()),remoto:true,sync:true};cambia=true;}}
    for(const p of S.ruta.paradas){const h=S.hecho[p.id];if(h&&h.remoto&&!on.has(p.pid)){delete S.hecho[p.id];cambia=true;}}
    if(cambia){guarda();calcula();}}catch(e){}
}

const MOTIVOS=['No estaba','Cerrado','Rechaza el pedido','Entrega parcial','Otro'];
// WhatsApp al cliente: «llego en unos X min»
function waURL(p,llega){const t=String(p.tel||'').replace(/\D/g,''),n=t.length===9?'34'+t:t,now=new Date(),m=llega!=null?Math.max(5,Math.round((llega-(now.getHours()*60+now.getMinutes()))/5)*5):15;
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(`Hola, soy el repartidor de El Gato con Bolsas. Llego en unos ${m} minutos con vuestro pedido.`);}
/* cierre del día: lo cobrado por forma de pago, lo apuntado a cuenta, incidencias y lo que queda */
function textoCierre(){const r=S.ruta,P=[...r.paradas].sort(porNum),f=r.fecha?new Date(r.fecha+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'';
  const tot={Efectivo:0,Bizum:0,Tarjeta:0},cta=[],inc=[],pend=[];
  for(const p of P){const h=S.hecho[p.id];if(!h){pend.push(p);continue;}if(h.inc)inc.push([p,h]);else if(h.pago==='A cuenta')cta.push(p);else if(tot[h.pago]!=null)tot[h.pago]+=+h.total||0;}
  return {f,P,tot,cta,inc,pend};}
function abreCierre(){
  const C=textoCierre(),sh=document.getElementById('sheet');sh.hidden=false;sh.className='sheetbg';const ent=C.P.length-C.pend.length-C.inc.length;
  sh.innerHTML=`<div class="panel pad" role="dialog" aria-modal="true" aria-labelledby="cT"><h2 id="cT">Cierre del día</h2><p>${esc(C.f)} · ${ent} entregados de ${C.P.length}${C.inc.length?' · '+C.inc.length+' sin entregar':''}${C.pend.length?' · '+C.pend.length+' pendientes':''}</p>
    <div class="cierre"><div><small>Efectivo a entregar</small><b class="num">${eur(C.tot.Efectivo)}</b></div><div><small>Bizum</small><b class="num">${eur(C.tot.Bizum)}</b></div><div><small>Tarjeta</small><b class="num">${eur(C.tot.Tarjeta)}</b></div><div><small>A cuenta</small><b class="num">${C.cta.length}</b></div></div>
    ${C.inc.length?`<div class="sect">No entregados</div><ul class="clist">${C.inc.map(([p,h])=>`<li><span><b>${numDe(p)}. ${esc(p.cli)}</b>${h.nota?'<br><small>'+esc(h.nota)+'</small>':''}</span><span>${esc(h.inc)}</span></li>`).join('')}</ul>`:''}
    ${C.pend.length?`<div class="sect">Sin hacer</div><ul class="clist">${C.pend.map(p=>`<li><span>${numDe(p)}. ${esc(p.cli)}</span><span>${eur(p.importe)}</span></li>`).join('')}</ul>`:''}
    <div class="acts"><button class="btn pri" data-m="copiaCierre">${ICON.check}Copiar resumen</button><button class="btn" data-m="x">Cerrar</button></div>
    <p class="tip">Los cobros y las incidencias ya han llegado cifrados a la nave${S.ruta.ejemplo?' (en la ruta de ejemplo no se envía nada)':''}. Entrega el efectivo al volver.</p></div>`;
  sh.onclick=e=>{if(e.target===sh)cierraImport();};}

async function accionMenu(a,v){
  if(a==='x'){cierraImport();return;}
  if(a==='dia'){cierraImport();SEC.dia=v;const r=SEC.rutas.find(x=>x.fecha===v);if(r)await abre(r);return;}
  if(a==='act'){cierraImport();toast('Buscando rutas…');await cargaRutas();return;}
  if(a==='demo'){cierraImport();SEC.rutaId=null;await ponRuta(sanea(DEMO));toast('Ruta de ejemplo (datos inventados)');return;}
  if(a==='clave'){cierraImport();try{await IDB.clear();}catch(e){}SEC.key=null;pantallaClave('Escribe tu clave nueva.');return;}
  if(a==='salir'){salir();return;}
  if(a==='copiaCierre'){const C=textoCierre(),txt=`CIERRE · ${C.f}\nEfectivo: ${eur(C.tot.Efectivo)} · Bizum: ${eur(C.tot.Bizum)} · Tarjeta: ${eur(C.tot.Tarjeta)} · A cuenta: ${C.cta.length}\n`+(C.inc.length?'No entregados:\n'+C.inc.map(([p,h])=>`  ${numDe(p)}. ${p.cli}: ${h.inc}${h.nota?' ('+h.nota+')':''}`).join('\n')+'\n':'')+(C.pend.length?'Sin hacer: '+C.pend.map(p=>p.cli).join(', '):'');
    try{await navigator.clipboard.writeText(txt);toast('Resumen copiado');}catch(e){toast('No se ha podido copiar');}return;}
}
function cierraImport(){const sh=document.getElementById('sheet');sh.hidden=true;sh.innerHTML='';}

  if(S.map){S.map.remove();S.map=null;}calcula();
}
